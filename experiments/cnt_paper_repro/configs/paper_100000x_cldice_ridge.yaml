experiment_name: cnt_paper_repro_100000x_center768_cldice_ridge
seed: 42

data:
  source_dataset_root: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_loss_compare\datasets\zzy_mid_100000_train50_test50_v2
  patch_dataset_root: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\datasets\zzy_mid_100000_patch768_center_paper_v1
  train_manifest: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\datasets\zzy_mid_100000_patch768_center_paper_v1\manifests\train_patch_manifest.csv
  val_manifest: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\datasets\zzy_mid_100000_patch768_center_paper_v1\manifests\val_patch_manifest.csv
  test_manifest: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\datasets\zzy_mid_100000_patch768_center_paper_v1\manifests\test_patch_manifest.csv
  reserve_manifest: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\datasets\zzy_mid_100000_patch768_center_paper_v1\manifests\reserve_patch_manifest.csv
  patch_size: 768
  patch_mode: center
  normalize_mean: 0.5
  normalize_std: 0.5
  augment: false

model:
  name: ResNet34UNet
  in_channels: 1
  num_classes: 1
  encoder_weights: imagenet

training:
  device: auto
  batch_size: 2
  num_workers: 0
  learning_rate: 0.0005
  weight_decay: 0.0
  selection_metric: dice
  phases:
    - name: dice
      epochs: 6
      dice_weight: 1.0
      orientation_weight: 0.0
      lambda_cl: 0.0
      lambda_ridge: 0.0
      orientation_bins: 360
      orientation_use_power_spectrum: true
    - name: dice_orientation_cldice_ridge
      epochs: 3
      dice_weight: 0.6
      orientation_weight: 1.0e-7
      lambda_cl: 0.1
      lambda_ridge: 0.05
      orientation_bins: 360
      orientation_use_power_spectrum: true

inference:
  threshold: 0.7

output:
  run_root: D:\CNTDATA\CNTA_ML_Project\experiments\cnt_paper_repro\runs
